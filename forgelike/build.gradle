plugins {
    id "org.jetbrains.kotlin.jvm"
    id "com.google.devtools.ksp"
    id "dev.kikugie.fletching-table"
    id "architectury-plugin" version "3.4.+"
    id "com.gradleup.shadow" version "9.0.0-rc2"
    id "me.modmuss50.mod-publish-plugin"
}

var neoforge = stonecutter.eval(stonecutter.current.version, ">=1.20.2")
var commonPr = stonecutter.node.sibling("").project
if (commonPr == null) {
    throw new Exception("No common project for $project")
}

var mc = commonPr.minecraft_version_override != "N/A" ?
        commonPr.minecraft_version_override : stonecutter.current.version

var loader = neoforge ? "neoforge" : "forge"
project.ext["loom.platform"] = loader

apply plugin: "dev.architectury.loom"

stonecutter.constants.put("forge", !neoforge)
stonecutter.constants.put("neoforge", neoforge)

version = "${rootProject.mod_version}+$mc"
base {
    archivesName.set("${rootProject.archives_base_name}-$loader")
}

architectury {
    platformSetupLoomIde()
    if (neoforge) {
        neoForge()
    } else {
        forge()
    }
}

loom {
    accessWidenerPath = commonPr.loom.accessWidenerPath

    decompilers {
        vineflower { // Adds names to lambdas - useful for mixins
            options.put("mark-corresponding-synthetics", "1")
        }
    }

    runConfigs.all {
        ideConfigGenerated true
        runDir = "../../../run"
    }

    if (!neoforge) {
        forge {
            mixinConfigs = ["moderner_beta-common.mixins.json", "moderner_beta-forgelike.mixins.json"]
            convertAccessWideners = true
        }
    }
}

fletchingTable {
    mixins.create("main") {
        mixin("default", "moderner_beta-forgelike.mixins.json")
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    if (neoforge) {
        developmentNeoForge.extendsFrom common
    } else {
        developmentForge.extendsFrom common
    }
}

repositories {
    if (neoforge) {
        maven {
            name "NeoForged"
            url "https://maven.neoforged.net/releases"
        }
    } else {
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:$mc"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$commonPr.parchment_mappings@zip")
    }

    if (neoforge) {
        neoForge "net.neoforged:neoforge:${commonPr.neoforge_version}"
    } else {
        forge "net.minecraftforge:forge:${commonPr.forge_version}"

        compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
        implementation(include("io.github.llamalad7:mixinextras-forge:0.5.0"))
    }

    common(project(path: commonPr.path, configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: commonPr.path, configuration: neoforge ? "transformProductionNeoForge" : "transformProductionForge")) { transitive false }
}

repositories {
    removeIf { ((MavenArtifactRepository) it).url.toString() == "https://maven.architectury.dev/" }

    mavenCentral()
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.parchmentmc.org" }
}

processResources {
    dependsOn commonPr.processResources

    var toExpand = [
        "version": commonPr.version,
        "loader_version_range": neoforge ? commonPr.neoforge_version_range : commonPr.forge_version_range,
        "minecraft_version_range": commonPr.forge_like_version_range,
        "mandatory": neoforge ? "" : "mandatory = true",
        "loader": neoforge ? "neoforge" : "forge"
    ]

    filesMatching("META-INF/mods.toml") {
        expand toExpand

        if (neoforge && stonecutter.eval(stonecutter.current.version, ">=1.20.5")) {
            it.name = "neoforge.mods.toml"
        }
    }

    filesMatching("moderner_beta-forgelike.mixins.json") {
        expand "java_version": stonecutter.eval(stonecutter.current.version, ">=1.20.5") ? 21 : 17
    }

    from(commonPr.file("src/main/generated")) {
        include "**/**"
        exclude ".cache"
    }

    from(commonPr.file("build/resources/main")) {
        include "**/**"
        filesMatching("**/*.nbt") {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }

        exclude "moderner_beta-common.mixins.json"
        exclude "assets/moderner_beta/icon.png"
    }
}

var outDir = rootProject.layout.buildDirectory.dir("libs/$loader")
shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    exclude "assets/moderner_beta/icon.png"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    if (!neoforge) {
        injectAccessWidener = true
    }

    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
    atAccessWideners.add "moderner_beta.accesswidener"
    destinationDirectory = outDir
}

remapSourcesJar {
    destinationDirectory = outDir
}

jar {
    archiveClassifier = "dev"
}

java {
    withSourcesJar()

    var javaVer = stonecutter.eval(stonecutter.current.version, ">=1.20.5") ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
    sourceCompatibility = javaVer
    targetCompatibility = javaVer
}

publishMods {
    displayName = "Moderner Beta " + project.version
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    file = remapJar.archiveFile
    modLoaders.add(neoforge ? "neoforge" : "forge")

    modrinth {
        accessToken = System.getenv("MODRINTH_TOKEN")
        projectId = commonPr.modrinth_project_id
        minecraftVersions.addAll(commonPr.supported_versions.split(",").toList())
    }

    curseforge {
        accessToken = System.getenv("CURSEFORGE_TOKEN")
        projectId = commonPr.curseforge_project_id
        minecraftVersions.addAll(commonPr.supported_versions.split(",").toList())
    }

    github {
        accessToken = System.getenv("_GITHUB_TOKEN")
        parent project(":").tasks.named("publishGithub")
    }

    forgejo {
        accessToken = System.getenv("FORGEJO_TOKEN")
        parent project(":").tasks.named("publishForgejo")
    }
}